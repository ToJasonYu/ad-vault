apiVersion: apps/v1
kind: Deployment
metadata:
  name: backoffice-rails
  namespace: ad-vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backoffice-rails
  template:
    metadata:
      labels:
        app: backoffice-rails
    spec:
      containers:
        - name: backoffice-rails
          image: ad-vault/backoffice-rails:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /up
              port: 3000
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backoffice-rails
  namespace: ad-vault
spec:
  selector:
    app: backoffice-rails
  ports:
    - port: 3000
      targetPort: 3000
