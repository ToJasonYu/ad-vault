apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-react
  namespace: ad-vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-react
  template:
    metadata:
      labels:
        app: dashboard-react
    spec:
      containers:
        - name: dashboard-react
          image: ad-vault/dashboard-react:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-react
  namespace: ad-vault
spec:
  selector:
    app: dashboard-react
  ports:
    - port: 80
      targetPort: 80
