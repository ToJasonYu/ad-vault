apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: ad-vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
    spec:
      containers:
        - name: ml-service
          image: ad-vault/ml-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: ad-vault
spec:
  selector:
    app: ml-service
  ports:
    - port: 8000
      targetPort: 8000
